<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diffusion Workbench — txt2img</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #111827;
    --panel-2: #1f2937;
    --border: #374151;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --accent: #f97316;
    --accent-hover: #fb923c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { color: var(--text-dim); font-size: 12px; }

  main { display: flex; gap: 16px; padding: 16px 20px; align-items: flex-start; }
  .controls { flex: 0 0 480px; display: flex; flex-direction: column; gap: 14px; }
  .results { flex: 1; min-width: 0; }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  select, input[type="number"], textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-size: 13px; outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  select:disabled { opacity: .65; cursor: not-allowed; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }

  #generate {
    width: 100%; padding: 12px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: #111; border: none; border-radius: 8px;
    cursor: pointer;
  }
  #generate:hover:not(:disabled) { background: var(--accent-hover); }
  #generate:disabled { opacity: .5; cursor: wait; }

  .progress-wrap { display: none; }
  .progress-wrap.active { display: block; }
  .progress-bar {
    height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden;
  }
  .progress-bar > div {
    height: 100%; width: 0%; background: var(--accent); transition: width .2s;
  }
  .progress-text { font-size: 12px; color: var(--text-dim); margin-top: 6px; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .card canvas, .card img { display: block; width: 100%; }
  .card .meta { padding: 10px 12px; font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .card .meta .prompt { color: var(--text); }

  .empty-hint {
    border: 1px dashed var(--border); border-radius: 8px;
    padding: 60px 20px; text-align: center; color: var(--text-dim);
  }
  .vae-badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; font-size: 11px;
    border-radius: 10px; background: #064e3b; color: #6ee7b7; vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <h1>Diffusion Workbench</h1>
  <span>txt2img · Krea 2 / Z-Image-Turbo（前端演示，未接后端）</span>
</header>

<main>
  <!-- ===================== 左侧：参数表单 ===================== -->
  <div class="controls">

    <div class="panel">
      <div class="field">
        <label>模型类型</label>
        <select id="modelType">
          <option value="zit">Z-Image-Turbo</option>
          <option value="krea2">Krea 2</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label>模型 Checkpoint</label>
          <select id="checkpoint"></select>
        </div>
        <div class="field">
          <label>VAE <span class="vae-badge">随模型类型自动切换</span></label>
          <select id="vae" disabled></select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="field">
        <label>Prompt</label>
        <textarea id="prompt" placeholder="描述你想要生成的画面……（中文 prompt 原生支持）"></textarea>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <div class="field">
          <label>采样器 Sampler</label>
          <select id="sampler">
            <option>FlowMatch Euler</option>
            <option>FlowMatch Heun</option>
            <option>FlowMatch LCM</option>
            <option>DPM++ 2M</option>
            <option>Euler a</option>
          </select>
        </div>
        <div class="field">
          <label>调度器 Scheduler</label>
          <select id="scheduler">
            <option>Automatic</option>
            <option>Uniform</option>
            <option>Karras</option>
            <option>Exponential</option>
            <option>SGM Uniform</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>图片大小（预设）</label>
        <select id="sizePreset"></select>
      </div>
      <div class="row">
        <div class="field">
          <label>宽度 (px)</label>
          <input type="number" id="width" step="64" min="256" max="4096">
        </div>
        <div class="field">
          <label>高度 (px)</label>
          <input type="number" id="height" step="64" min="256" max="4096">
        </div>
      </div>
    </div>

    <button id="generate">生成 Generate</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div id="progressBar"></div></div>
      <div class="progress-text" id="progressText">准备中……</div>
    </div>
  </div>

  <!-- ===================== 右侧：结果 ===================== -->
  <div class="results">
    <div class="empty-hint" id="emptyHint">生成的图片会显示在这里</div>
    <div class="gallery" id="gallery"></div>
  </div>
</main>

<script>
// ---------------------------------------------------------------------------
// 模型注册表（与后端/ComfyUI 文件一一对应；前端演示用，路径仅为展示）
// ---------------------------------------------------------------------------
const MODELS = {
  zit: {
    name: "Z-Image-Turbo",
    checkpoints: ["redcraftRedzimage_unet.safetensors"],
    vae: "zit-ae.safetensors",
    defaultSteps: 9,
    // Z-Image 常用 1024 档位
    sizes: [[1024,1024],[1152,864],[864,1152],[1280,720],[720,1280],[1440,810],[810,1440]],
  },
  krea2: {
    name: "Krea 2",
    checkpoints: ["[赤佬1.1]redcraft22KREA2INT8_11INT8Native.safetensors"],
    vae: "qwen_image_vae.safetensors",
    defaultSteps: 8,
    // Krea 2 原生 2K
    sizes: [[2048,2048],[1024,1024],[1536,1024],[1024,1536],[2304,1296],[1296,2304]],
  },
};

const $ = id => document.getElementById(id);
const els = {
  modelType: $("modelType"), checkpoint: $("checkpoint"), vae: $("vae"),
  prompt: $("prompt"), sampler: $("sampler"), scheduler: $("scheduler"),
  sizePreset: $("sizePreset"), width: $("width"), height: $("height"),
  generate: $("generate"), progressWrap: $("progressWrap"),
  progressBar: $("progressBar"), progressText: $("progressText"),
  gallery: $("gallery"), emptyHint: $("emptyHint"),
};

// 切换模型类型 → 刷新 checkpoint 列表、自动绑定对应 VAE、刷新尺寸预设
function onModelTypeChange() {
  const cfg = MODELS[els.modelType.value];

  els.checkpoint.innerHTML = "";
  cfg.checkpoints.forEach(name => {
    const opt = document.createElement("option");
    opt.textContent = name;
    els.checkpoint.appendChild(opt);
  });

  els.vae.innerHTML = "";
  const vaeOpt = document.createElement("option");
  vaeOpt.textContent = cfg.vae;
  els.vae.appendChild(vaeOpt);

  els.sizePreset.innerHTML = "";
  cfg.sizes.forEach(([w, h]) => {
    const opt = document.createElement("option");
    opt.value = `${w}x${h}`;
    opt.textContent = `${w} × ${h}`;
    els.sizePreset.appendChild(opt);
  });
  applySizePreset();
}

function applySizePreset() {
  const [w, h] = els.sizePreset.value.split("x").map(Number);
  els.width.value = w;
  els.height.value = h;
}

els.modelType.addEventListener("change", onModelTypeChange);
els.sizePreset.addEventListener("change", applySizePreset);
// 手动改宽高时脱离预设
[els.width, els.height].forEach(el => el.addEventListener("input", () => {
  els.sizePreset.value = `${els.width.value}x${els.height.value}` || els.sizePreset.value;
}));

// ---------------------------------------------------------------------------
// 生成（前端 mock：假进度条 + 占位图，不接后端）
// ---------------------------------------------------------------------------
let generating = false;

function mockGenerate() {
  if (generating) return;
  if (!els.prompt.value.trim()) { els.prompt.focus(); return; }

  generating = true;
  els.generate.disabled = true;
  els.generate.textContent = "生成中……";
  els.progressWrap.classList.add("active");

  const cfg = MODELS[els.modelType.value];
  const steps = cfg.defaultSteps;
  let step = 0;

  const timer = setInterval(() => {
    step++;
    const pct = Math.min(100, Math.round(step / steps * 100));
    els.progressBar.style.width = pct + "%";
    els.progressText.textContent = `采样中 ${step}/${steps} 步（${els.sampler.value} / ${els.scheduler.value}）—— 演示模式，未实际推理`;
    if (step >= steps) {
      clearInterval(timer);
      finishGeneration();
    }
  }, 300);
}

function finishGeneration() {
  const w = Number(els.width.value), h = Number(els.height.value);
  const cfg = MODELS[els.modelType.value];

  // 占位图：canvas 渐变 + 参数文字
  const scale = Math.min(1, 512 / Math.max(w, h));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  const hue = Math.floor(Math.random() * 360);
  grad.addColorStop(0, `hsl(${hue}, 45%, 22%)`);
  grad.addColorStop(1, `hsl(${(hue + 60) % 360}, 50%, 12%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.font = `${Math.max(13, canvas.width / 22)}px sans-serif`;
  ctx.textAlign = "center";
  ctx.fillText("演示占位图", canvas.width / 2, canvas.height / 2 - 10);
  ctx.font = `${Math.max(11, canvas.width / 30)}px sans-serif`;
  ctx.fillText(`${w} × ${h}`, canvas.width / 2, canvas.height / 2 + 18);

  const card = document.createElement("div");
  card.className = "card";
  card.appendChild(canvas);
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML =
    `<div class="prompt">${escapeHtml(els.prompt.value)}</div>` +
    `<div>模型类型: ${cfg.name} · Checkpoint: ${els.checkpoint.value}</div>` +
    `<div>VAE: ${cfg.vae}</div>` +
    `<div>采样器: ${els.sampler.value} · 调度器: ${els.scheduler.value}</div>` +
    `<div>尺寸: ${w} × ${h}</div>`;
  card.appendChild(meta);

  els.emptyHint.style.display = "none";
  els.gallery.prepend(card);

  generating = false;
  els.generate.disabled = false;
  els.generate.textContent = "生成 Generate";
  els.progressText.textContent = "完成（演示模式）";
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

els.generate.addEventListener("click", mockGenerate);

// 初始化
onModelTypeChange();
</script>
</body>
</html>
