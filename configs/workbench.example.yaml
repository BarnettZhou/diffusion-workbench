# diffusion-workbench 主配置模板。
# 使用方法:复制本文件为 configs/workbench.yaml,再把路径改成本机实际位置。
# configs/workbench.yaml 含本机绝对路径,已被 .gitignore 忽略,不会提交。

comfyui:
  # ComfyUI 安装根目录与自带的 Python 解释器(Worker 子进程必须用它运行)
  root: C:\path\to\ComfyUI
  python: C:\path\to\ComfyUI\python\python.exe

resources:
  # 每种模式的模型资源。diffusion / vae / text_encoder 是目录或文件列表
  # (可多个,扫描其中的模型文件;旧的 text_encoder 单文件标量写法仍兼容);
  # clip_type 决定文本编码器类型,不随所选编码器变化。
  zit:
    diffusion:
      - D:\models\diffusion_models\zit
    vae:
      - D:\models\vae\zit
    text_encoder:
      - D:\models\text_encoders
    clip_type: stable_diffusion
  krea2:
    diffusion:
      - D:\models\diffusion_models\krea2
    vae:
      - D:\models\vae\krea2
    text_encoder:
      - D:\models\text_encoders
    clip_type: krea2
    # Krea2 图像编辑专用 LoRA；提交 Mode.KREA2_EDIT 任务时必须配置且文件存在。
    edit_lora: D:\models\loras\krea2\krea2_identity_edit_v1_2.safetensors
    # krea2 模式可选 LoRA 候选目录/文件列表；前端按 index 选择，最多 3 个。
    loras:
      - D:\models\loras
  zib:
    diffusion:
      - D:\models\diffusion_models\zib
    vae:
      - D:\models\vae\zit
    text_encoder:
      - D:\models\text_encoders
    clip_type: stable_diffusion
  # sdxl 使用完整 checkpoint(model_loader: checkpoint),只需配置 checkpoint 目录
  sdxl:
    model_loader: checkpoint
    diffusion:
      - D:\models\checkpoints

upscaling:
  # 放大模型目录(可选)
  models:
    - D:\models\upscale_models

# 视频资源。MiniMax H3 需分别配置视频 VAE 与音频 VAE；diffusion 目录可同时放置 FL2VA/Ref2VA 模型。
# Wan 14B I2V 的 diffusion 目录需要同时包含同格式的 high_noise 与 low_noise 文件；
# 可使用 safetensors，或在已安装 ComfyUI-GGUF 时使用 GGUF。
# text_encoder 与图片侧一样是目录/文件列表(可多个,扫描其中模型文件,提交时按 index 选择);
# 旧的单文件标量写法仍兼容。
video_resources:
  # MiniMax H3 两种任务权重拆成两个类型,通常指向同一目录:
  # fl2va 列表自动排除文件名含 ref2va 的模型,ref2va 列表只保留含 ref2va 的模型
  minimax-h3-fl2va:
    diffusion:
      - D:\models\diffusion_models\h3
    vae:
      - D:\models\vae\h3\minimax_h3_video_vae_fp16.safetensors
    text_encoder:
      - D:\models\text_encoders\h3
    audio_vae: D:\models\vae\h3\minimax_h3_audio_vae_fp32.safetensors
    clip_type: minimax
  minimax-h3-ref2va:
    diffusion:
      - D:\models\diffusion_models\h3
    vae:
      - D:\models\vae\h3\minimax_h3_video_vae_fp16.safetensors
    text_encoder:
      - D:\models\text_encoders\h3
    audio_vae: D:\models\vae\h3\minimax_h3_audio_vae_fp32.safetensors
    clip_type: minimax
  # Turbo：复用 fl2va 权重 + 常驻蒸馏 LoRA，euler + beta 调度少步数采样（默认 8 步）。
  # diffusion/vae/text_encoder/audio_vae 与 fl2va 一致，额外必须配置 turbo_lora。
  minimax-h3-turbo:
    diffusion:
      - D:\models\diffusion_models\h3
    vae:
      - D:\models\vae\h3\minimax_h3_video_vae_fp16.safetensors
    text_encoder:
      - D:\models\text_encoders\h3
    audio_vae: D:\models\vae\h3\minimax_h3_audio_vae_fp32.safetensors
    turbo_lora: D:\models\loras\h3\minimax_h3_fl2v_lightx2v_turbo_4step_v0.1_comfy.safetensors
    clip_type: minimax
  wan2.2-ti2v-5b:
    diffusion:
      - D:\models\diffusion_models\wan2.2
    vae:
      - D:\models\vae\wan2.2
    text_encoder:
      - D:\models\text_encoders\wan
    clip_type: wan
  wan2.2-i2v-14b:
    diffusion:
      - D:\models\diffusion_models\wan2.2-i2v-14b
    vae:
      - D:\models\vae\wan_2.1_vae.safetensors
    text_encoder:
      - D:\models\text_encoders\wan
    clip_type: wan

# 生成图片输出目录(相对项目根目录)
output_dir: output
# SQLite 任务库路径
database: .cache\diffusion_workbench.sqlite3
# Worker 子进程无响应超时(秒)
worker_timeout_seconds: 3600
# 视频任务通常比图片耗时更长，单独设置超时(秒)
video_worker_timeout_seconds: 3600

# 远端 text encoder（Mac 源码版 ComfyUI 服务）；默认关闭。
remote_encoder:
  enabled: false
  host: 127.0.0.1
  port: 50051
  connect_timeout_seconds: 5
  request_timeout_seconds: 60
  # Krea2/edit-krea2 默认建议关闭 fallback，避免远端失败后本地显存 OOM。
  fallback_to_local: false
  # 远端服务可用的 encoder id；仅用于前端下拉框展示。
  encoder_ids:
    - qwen3vl_4b_fp8.safetensors
    - qwen3vl_4b_abliterated.safetensors
    - qwen3_4b.safetensors
